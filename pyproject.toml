[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhlab"
version = "0.1.0"
description = "A CPU-only study of reward-model over-optimization (Goodhart / reward hacking) in self-improvement: rejection-sampling fine-tuning of a tiny transformer against an exact verifier vs an imperfect learned reward model, with proxy-vs-true-accuracy divergence curves and honest caveats."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lesereingrape" }]
keywords = ["post-training", "rlhf", "reward-model", "reward-hacking", "goodhart", "self-improvement", "pytorch"]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14,<0.15"]

[project.scripts]
rhlab = "rhlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF", "B", "C4", "SIM", "FURB"]
ignore = ["SIM105"]
